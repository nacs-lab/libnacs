name: MSYS2

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  MSYS2_ARG_CONV_EXCL: -DCMAKE_INSTALL_PREFIX=
  CXXFLAGS_COV: -fprofile-arcs -ftest-coverage

jobs:
  build:
    name: "${{matrix.msystem}} ${{matrix.BUILD_TYPE}} build${{matrix.with_llvm && (matrix.static_llvm && ' (static LLVM)' || ' (shared LLVM)') || ' (no LLVM)'}}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        msystem: [ UCRT64 ]
        BUILD_TYPE: [ Release, Debug ]
        with_llvm: [ true, false ]
        static_llvm: [ true ]
        include:
          - msystem: UCRT64
            BUILD_TYPE: Release
            with_llvm: true
            static_llvm: false
          # Other environments
          - msystem: MINGW64
            BUILD_TYPE: Debug
            with_llvm: true
            static_llvm: true
          - msystem: CLANG64
            BUILD_TYPE: Debug
            with_llvm: true
            static_llvm: true

    steps:
    - uses: actions/checkout@v7

    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        suppress-deprecation-warnings: ${{ matrix.msystem == 'MINGW64' && 'msystem-mingw64' || '' }}
        install: >-
          make
        # openlibm (optional) was dropped from MINGW64
        pacboy: >-
          cmake:p
          toolchain:p
          libwinpthread:p
          llvm:p
          ${{ matrix.msystem != 'MINGW64' && 'openlibm:p' || '' }}
          polly:p
          tbb:p
          yaml-cpp:p
          zeromq:p
          cppzmq:p

    - name: Setup compiler
      shell: msys2 {0}
      run: |
        if [[ $MSYSTEM = CLANG* ]]; then
            cc=clang cxx=clang++ gcov='llvm-cov gcov'
        else
            cc=gcc cxx=g++ gcov=gcov
        fi
        {
            echo "CC=${MINGW_PREFIX}/bin/${cc}"
            echo "CXX=${MINGW_PREFIX}/bin/${cxx}"
            echo "GCOV=${MINGW_PREFIX}/bin/${gcov}"
        } >> "$GITHUB_ENV"

    # The official sleef package doesn't have the patch for the calling convention.
    - name: Install sleef from the NaCs package repository
      shell: msys2 {0}
      env:
        NACS_REPO: https://nacs-lab.github.io/nacs-pkgs
        NACS_KEY_ID: FB3383FB18F0EC34A1ABC3D275A6768C2AA33C49
      run: |
        curl -fsSL -o nacs.asc "${NACS_REPO}/nacs.asc"
        pacman-key --add nacs.asc
        pacman-key --lsign-key "${NACS_KEY_ID}"
        # The repository for MINGW64 is named `nacs`,
        # the other environments have the environment name as suffix.
        env=${MSYSTEM,,}
        name=nacs
        [[ $MSYSTEM = MINGW64 ]] || name=nacs-$env
        printf '\n[%s]\nServer = %s/msys2/%s\n' "$name" "${NACS_REPO}" "$env" >> /etc/pacman.conf
        pacman -Sy --noconfirm "${MINGW_PACKAGE_PREFIX}-sleef-git"

    - name: Configure CMake
      shell: msys2 {0}
      run: CXXFLAGS+=" ${CXXFLAGS_COV}" cmake -B '${{github.workspace}}/build' -DCMAKE_BUILD_TYPE=${{matrix.BUILD_TYPE}} -DENABLE_SIMD=On -DENABLE_LLVM=${{matrix.with_llvm && 'On' || 'Off'}} -DSTATIC_LLVM=${{matrix.static_llvm && 'On' || 'Off'}} -DCMAKE_INSTALL_PREFIX="${MINGW_PREFIX}" -G 'MSYS Makefiles'

    - name: Build
      shell: msys2 {0}
      run: cmake --build '${{github.workspace}}/build' --config ${{matrix.BUILD_TYPE}} -j $(nproc)

    - name: Builder info
      shell: msys2 {0}
      working-directory: ${{github.workspace}}/build
      run: output-bin/nacs-cpudump

    - name: Test
      shell: msys2 {0}
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{matrix.BUILD_TYPE}} -E /excluded --output-on-failure -j $(nproc)

    - name: Generate coverage report
      shell: msys2 {0}
      run: |
        find build/{lib,tools} -iname '*.obj' -exec ${GCOV} -abcfupr {} -s $(cygpath -u '${{github.workspace}}') \;

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
