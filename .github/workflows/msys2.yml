name: MSYS2

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CC: /mingw64/bin/gcc
  CXX: /mingw64/bin/g++
  MSYS2_ARG_CONV_EXCL: -DCMAKE_INSTALL_PREFIX=
  CXXFLAGS_COV: -fprofile-arcs -ftest-coverage

jobs:
  build:
    name: "${{matrix.BUILD_TYPE}} build${{matrix.with_llvm && (matrix.static_llvm && ' (static LLVM)' || ' (shared LLVM)') || ' (no LLVM)'}}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        BUILD_TYPE: [ Release, Debug ]
        with_llvm: [ true, false ]
        static_llvm: [ true ]
        include:
          - BUILD_TYPE: Release
            with_llvm: true
            static_llvm: false

    steps:
    - uses: actions/checkout@v7

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          make
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-libwinpthread
          mingw-w64-x86_64-llvm
          mingw-w64-x86_64-openlibm
          mingw-w64-x86_64-polly
          mingw-w64-x86_64-tbb
          mingw-w64-x86_64-yaml-cpp
          mingw-w64-x86_64-zeromq
          mingw-w64-x86_64-cppzmq

    # The official sleef package doesn't have the patch for the calling convention.
    - name: Install sleef from the NaCs package repository
      shell: msys2 {0}
      env:
        NACS_REPO: https://nacs-lab.github.io/nacs-pkgs
        NACS_KEY_ID: FB3383FB18F0EC34A1ABC3D275A6768C2AA33C49
      run: |
        curl -fsSL -o nacs.asc "${NACS_REPO}/nacs.asc"
        pacman-key --add nacs.asc
        pacman-key --lsign-key "${NACS_KEY_ID}"
        printf '\n[nacs]\nServer = %s/msys2/mingw64\n' "${NACS_REPO}" >> /etc/pacman.conf
        pacman -Sy --noconfirm mingw-w64-x86_64-sleef-git

    - name: Configure CMake
      shell: msys2 {0}
      run: CXXFLAGS+=" ${CXXFLAGS_COV}" cmake -B '${{github.workspace}}/build' -DCMAKE_BUILD_TYPE=${{matrix.BUILD_TYPE}} -DENABLE_SIMD=On -DENABLE_LLVM=${{matrix.with_llvm && 'On' || 'Off'}} -DSTATIC_LLVM=${{matrix.static_llvm && 'On' || 'Off'}} -DCMAKE_INSTALL_PREFIX=/mingw64 -G 'MSYS Makefiles'

    - name: Build
      shell: msys2 {0}
      run: cmake --build '${{github.workspace}}/build' --config ${{matrix.BUILD_TYPE}} -j $(nproc)

    - name: Builder info
      shell: msys2 {0}
      working-directory: ${{github.workspace}}/build
      run: output-bin/nacs-cpudump

    - name: Test
      shell: msys2 {0}
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{matrix.BUILD_TYPE}} -E /excluded --output-on-failure -j $(nproc)

    - name: Generate coverage report
      shell: msys2 {0}
      run: |
        find build/{lib,tools} -iname '*.obj' -exec /mingw64/bin/gcov -abcfupr {} -s $(cygpath -u '${{github.workspace}}') \;

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
